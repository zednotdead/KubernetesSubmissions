---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.11/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-output-pvc
spec:
  storageClassName: log-output-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
