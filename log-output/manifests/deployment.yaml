---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.11/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashresponse-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashresponse
  template:
    metadata:
      labels:
        app: hashresponse
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: log-output-pvc
      containers:
        - name: log-output
          image: ghcr.io/zednotdead/log-output:1.10
          volumeMounts:
            - mountPath: /usr/share/app/files
              name: shared-files
        - name: log-writer
          image: ghcr.io/zednotdead/log-writer:1.10
          volumeMounts:
            - mountPath: /usr/share/app/files
              name: shared-files
